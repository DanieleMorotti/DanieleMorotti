name: Update profile stats

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=DanieleMorotti&count_private=true&show=prs_merged,prs_merged_percentage&show_icons=true&include_all_commits=true&hide=contribs&rank_icon=percentile'
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update profile stats" || exit 0
          git push
